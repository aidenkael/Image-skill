# crystal 技能 — 6 个固定实拍场景（批准资产，禁止程序化生成/替换式重绘）
# 画布固定 1200x1600（3:4 竖幅）。模板图可直接替换同名 jpg（保持 3:4），无需改代码。
# 布局字段：
#   bracelet_box  手镯摆放区 [x1, y1, x2, y2]
#   bead_row      代表珠横排（y 为中心线，x_start/x_end 为分布范围，size 为最大直径）
#   label_row     中文名称基线 y（位于每颗珠子正下方，水平居中）
#   shadow        接触阴影（偏移/模糊/不透明度）
#   rotation_range / scale_range  手镯轻微随机摆放范围

canvas:
  width: 1200
  height: 1600

scenes:
  "01":
    name: "米色亚麻珠宝托盘"
    background: "templates/01.jpg"
    bracelet_box: [190, 400, 840, 1120]
    bead_row:
      y: 1420
      x_start: 170
      x_end: 1030
      size: 150
    label_row:
      y: 1540
    shadow:
      offset: [6, 10]
      blur: 16
      opacity: 0.25
    rotation_range: [-4, 4]
    scale_range: [0.96, 1.04]

