# crystal 技能 — 6 个固定实拍风格场景
# 画布固定 1600x1200；模板图可直接替换同名 jpg，无需改代码。
# 布局字段含义：
#   bracelet_box   手镯摆放区 [x1, y1, x2, y2]
#   sample_column  右侧代表珠列（x 为中心线，y_start 为首颗中心，gap 为间距）
#   label_column   中文名称文字起点（x）
#   shadow         接触阴影（偏移/模糊/不透明度）
#   rotation_range 手镯轻微随机旋转角度范围（度，保持俯拍视角合理性）
#   scale_range    手镯轻微随机缩放范围

canvas:
  width: 1600
  height: 1200

scenes:
  "01":
    name: "米色亚麻珠宝托盘"
    background: "templates/01.jpg"
    bracelet_box: [80, 140, 880, 1040]
    sample_column:
      x: 1060
      y_start: 280
      gap: 230
    label_column:
      x: 1240
    shadow:
      offset: [8, 12]
      blur: 18
      opacity: 0.22
    rotation_range: [-4, 4]
    scale_range: [0.96, 1.04]

